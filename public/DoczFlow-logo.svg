<?xml version="1.0" encoding="utf-8"?>
<svg width="72" height="88" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FlowWrite Logo Icon</title>
  <desc id="desc">Compact icon of FlowWrite with gradient paper and sync arrows.</desc>

  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#06B6A4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1726" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Main icon -->
  <g transform="translate(8,4)" filter="url(#soft)">
    <!-- Paper -->
    <rect x="0" y="0" width="72" height="80" rx="8" fill="url(#g1)"/>
    <!-- Fold -->
    <path d="M44 0 H72 V24 L44 0 Z" fill="#ffffff" opacity="0.12"/>
    <!-- Lines -->
    <g fill="#ffffff" opacity="0.9" transform="translate(10,14)">
      <rect x="0" y="0" width="44" height="4" rx="2"/>
      <rect x="0" y="12" width="34" height="4" rx="2"/>
      <rect x="0" y="24" width="46" height="4" rx="2"/>
    </g>

    <!-- Sync arrows -->
    <g transform="translate(36,46)">
      <circle r="26" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
      <path d="M-6,-26 A26,26 0 0,1 22,-6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18,-10 L26,-6 L22,2" fill="#ffffff"/>
      <path d="M6,26 A26,26 0 0,1 -22,6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-18,10 L-26,6 L-22,-2" fill="#ffffff"/>
      <circle cx="-18" cy="-4" r="3.2" fill="#FFD166"/>
      <circle cx="18" cy="6" r="3.6" fill="#06D6A0"/>
      <circle cx="0" cy="14" r="3.2" fill="#FF6B6B"/>
    </g>
  </g>
</svg>
